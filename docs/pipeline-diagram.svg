<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 790" width="1280" height="790" role="img" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
<title>Release pipeline: pull request to production</title>
<desc>CI in the app repo (PR checks, merge gate, build once and scan, push to GHCR, bump dev tag) feeds a GitOps repo where Argo CD deploys dev, staging and prod. Promotion is a Git commit; prod needs approval; rollback is git revert.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .h{font-size:15px;font-weight:600}
    .s{font-size:13px}
    .band{font-size:15px;font-weight:600;fill:#444441}
    .ci rect{fill:#E6F1FB;stroke:#185FA5}
    .ci .h{fill:#0C447C}.ci .s{fill:#185FA5}
    .gate rect{fill:#FAEEDA;stroke:#854F0B}
    .gate .h{fill:#633806}.gate .s{fill:#854F0B}
    .reg rect{fill:#EEEDFE;stroke:#534AB7}
    .reg .h{fill:#3C3489}.reg .s{fill:#534AB7}
    .git rect{fill:#F1EFE8;stroke:#5F5E5A}
    .git .h{fill:#2C2C2A}.git .s{fill:#5F5E5A}
    .cd rect{fill:#E1F5EE;stroke:#0F6E56}
    .cd .h{fill:#085041}.cd .s{fill:#0F6E56}
    .rb rect{fill:#FAECE7;stroke:#993C1D}
    .rb .h{fill:#712B13}.rb .s{fill:#993C1D}
    .ln{stroke:#5F5E5A;stroke-width:1.5;fill:none}
    .lbl{font-size:12px;fill:#5F5E5A}
  </style>
</defs>
<rect x="0" y="0" width="1280" height="790" fill="#FFFFFF"/>
<text x="40" y="32" font-size="20" font-weight="600" fill="#2C2C2A">Release pipeline: pull request to production</text>

<rect x="30" y="50" width="1220" height="196" rx="14" fill="none" stroke="#B4B2A9" stroke-dasharray="6 5"/>
<text class="band" x="50" y="78">1 · App repo: GitHub Actions (CI)</text>

<g class="ci"><rect x="50" y="98" width="210" height="124" rx="8"/>
<text class="h" x="155" y="128" text-anchor="middle">Pull request</text>
<text class="s" x="155" y="154" text-anchor="middle">feature branch → main</text>
<text class="s" x="155" y="174" text-anchor="middle">small, reviewable change</text></g>

<g class="ci"><rect x="285" y="98" width="210" height="124" rx="8"/>
<text class="h" x="390" y="128" text-anchor="middle">pr.yaml checks</text>
<text class="s" x="390" y="154" text-anchor="middle">ruff lint + pytest</text>
<text class="s" x="390" y="174" text-anchor="middle">build api + migrate</text>
<text class="s" x="390" y="194" text-anchor="middle">Trivy: fail on CRIT/HIGH</text></g>

<g class="gate"><rect x="520" y="98" width="210" height="124" rx="8"/>
<text class="h" x="625" y="128" text-anchor="middle">Merge gate</text>
<text class="s" x="625" y="154" text-anchor="middle">branch protection on main</text>
<text class="s" x="625" y="174" text-anchor="middle">PR + 2 required checks</text></g>

<g class="ci"><rect x="755" y="98" width="210" height="124" rx="8"/>
<text class="h" x="860" y="128" text-anchor="middle">main.yaml: build once</text>
<text class="s" x="860" y="154" text-anchor="middle">tag = sha-&lt;commit&gt;</text>
<text class="s" x="860" y="174" text-anchor="middle">Trivy scan before push</text>
<text class="s" x="860" y="194" text-anchor="middle">push api + migrate</text></g>

<g class="ci"><rect x="990" y="98" width="210" height="124" rx="8"/>
<text class="h" x="1095" y="128" text-anchor="middle">bump-dev-tag</text>
<text class="s" x="1095" y="154" text-anchor="middle">deploy key (1 repo only)</text>
<text class="s" x="1095" y="174" text-anchor="middle">yq sets envs/dev tag</text>
<text class="s" x="1095" y="194" text-anchor="middle">commit as bot, idempotent</text></g>

<line class="ln" x1="260" y1="160" x2="282" y2="160" marker-end="url(#a)"/>
<line class="ln" x1="495" y1="160" x2="517" y2="160" marker-end="url(#a)"/>
<line class="ln" x1="730" y1="160" x2="752" y2="160" marker-end="url(#a)"/>
<line class="ln" x1="965" y1="160" x2="987" y2="160" marker-end="url(#a)"/>

<g class="reg"><rect x="755" y="266" width="210" height="64" rx="8"/>
<text class="h" x="860" y="292" text-anchor="middle">GHCR registry</text>
<text class="s" x="860" y="314" text-anchor="middle">built once, pulled by all envs</text></g>
<line class="ln" x1="860" y1="222" x2="860" y2="263" marker-end="url(#a)"/>

<path class="ln" d="M1095 222 V350 H210 V427" marker-end="url(#a)"/>
<text class="lbl" x="230" y="343">bot commits the new tag to envs/dev</text>

<rect x="30" y="370" width="1220" height="408" rx="14" fill="none" stroke="#B4B2A9" stroke-dasharray="6 5"/>
<text class="band" x="390" y="398">2 · GitOps repo + Argo CD (CD, pull-based)</text>

<g class="git"><rect x="60" y="430" width="300" height="64" rx="8"/>
<text class="h" x="210" y="456" text-anchor="middle">envs/dev/values.yaml</text>
<text class="s" x="210" y="478" text-anchor="middle">image.tag: sha-&lt;commit&gt;</text></g>
<g class="git"><rect x="490" y="430" width="300" height="64" rx="8"/>
<text class="h" x="640" y="456" text-anchor="middle">envs/staging/values.yaml</text>
<text class="s" x="640" y="478" text-anchor="middle">same tag, copied from dev</text></g>
<g class="git"><rect x="920" y="430" width="300" height="64" rx="8"/>
<text class="h" x="1070" y="456" text-anchor="middle">envs/prod/values.yaml</text>
<text class="s" x="1070" y="478" text-anchor="middle">same tag, copied from staging</text></g>

<line class="ln" x1="360" y1="462" x2="487" y2="462" marker-end="url(#a)"/>
<line class="ln" x1="790" y1="462" x2="917" y2="462" marker-end="url(#a)"/>
<g class="gate"><rect x="367" y="500" width="116" height="50" rx="8"/>
<text class="h" x="425" y="521" text-anchor="middle" style="font-size:13px">promote.yaml</text>
<text class="s" x="425" y="540" text-anchor="middle" style="font-size:12px">manual run</text></g>
<g class="gate"><rect x="797" y="500" width="116" height="50" rx="8"/>
<text class="h" x="855" y="521" text-anchor="middle" style="font-size:13px">promote.yaml</text>
<text class="s" x="855" y="540" text-anchor="middle" style="font-size:12px">needs approval</text></g>

<g class="cd"><rect x="60" y="566" width="300" height="64" rx="8"/>
<text class="h" x="210" y="592" text-anchor="middle">Argo CD · api-dev</text>
<text class="s" x="210" y="614" text-anchor="middle">waves: DB → migrate → API</text></g>
<g class="cd"><rect x="490" y="566" width="300" height="64" rx="8"/>
<text class="h" x="640" y="592" text-anchor="middle">Argo CD · api-staging</text>
<text class="s" x="640" y="614" text-anchor="middle">waves: DB → migrate → API</text></g>
<g class="cd"><rect x="920" y="566" width="300" height="64" rx="8"/>
<text class="h" x="1070" y="592" text-anchor="middle">Argo CD · api-prod</text>
<text class="s" x="1070" y="614" text-anchor="middle">waves: DB → migrate → API</text></g>

<line class="ln" x1="210" y1="494" x2="210" y2="563" marker-end="url(#a)"/>
<line class="ln" x1="640" y1="494" x2="640" y2="563" marker-end="url(#a)"/>
<line class="ln" x1="1070" y1="494" x2="1070" y2="563" marker-end="url(#a)"/>

<g class="cd"><rect x="60" y="656" width="300" height="48" rx="8"/>
<text class="h" x="210" y="685" text-anchor="middle">namespace dev · /version</text></g>
<g class="cd"><rect x="490" y="656" width="300" height="48" rx="8"/>
<text class="h" x="640" y="685" text-anchor="middle">namespace staging · /version</text></g>
<g class="cd"><rect x="920" y="656" width="300" height="48" rx="8"/>
<text class="h" x="1070" y="685" text-anchor="middle">namespace prod · /version</text></g>
<line class="ln" x1="210" y1="630" x2="210" y2="653" marker-end="url(#a)"/>
<line class="ln" x1="640" y1="630" x2="640" y2="653" marker-end="url(#a)"/>
<line class="ln" x1="1070" y1="630" x2="1070" y2="653" marker-end="url(#a)"/>

<g class="rb"><rect x="60" y="718" width="1160" height="44" rx="8"/>
<text class="h" x="80" y="745">Rollback:</text>
<text class="s" x="160" y="745">git revert the bump/promote commit on envs/&lt;env&gt; → Argo CD syncs the previous tag. Nothing is rebuilt.</text></g>
</svg>
