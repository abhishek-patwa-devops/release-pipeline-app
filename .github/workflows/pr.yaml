name: PR Validation Check

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      # 1. Check out the pull request's code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up the runtime environment (python example)
      - name: Setup python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: api/requirements-dev.txt

      # 3. Install project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 4. Run code linter
      - name: Run linter
        run: |
          ruff check . 


      # 5. Run automated tests
      - name: Run tests
        run: python -m pytest -v

  build-and-scan:    
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4  

      # 2. Build API Docker image
      - name: Build API image
        run: docker build -t api:pr-test ./api

      # 3. Build Migrations Docker image
      - name: Build Migrations image
        run: docker build -t migrate:pr-test ./migrations

      # 4. Run Trivy vulnerability scan on api:pr-test
      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'api:pr-test'
          format: 'table'
          exit-code: '1' # Fails the PR if HIGH or CRITICAL vulnerabilities are found
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
